name: Deploy

# Runs only after the `tests` workflow has finished on a push to main, and
# only when it passed — a red build never reaches the server. (The `tests`
# workflow's name must stay `tests` for this trigger to match.)
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

# One deploy at a time; a newer one waits instead of cancelling a running one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: self-hosted
    env:
      COMPOSE_PROJECT_NAME: skatepark
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Deploy exactly the commit the tests ran against, not whatever main
      # happens to be by the time this job starts.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false

      # With deploys queued, an older run could otherwise finish after a
      # newer one and put older code on the server.
      - name: Skip if main has moved on
        id: fresh
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "main is now at $(git rev-parse --short FETCH_HEAD), not ${DEPLOY_SHA}; skipping this deploy."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create .env
        if: steps.fresh.outputs.current == 'true'
        run: |
          cp .env.example .env
          sed -i "s|^APP_ENV=.*|APP_ENV=production|" .env
          sed -i "s|^APP_DEBUG=.*|APP_DEBUG=false|" .env
          sed -i "s|^APP_KEY=.*|APP_KEY=${{ secrets.APP_KEY }}|" .env
          sed -i "s|^APP_URL=.*|APP_URL=https://www.xn--rull-eva.lv|" .env
          sed -i "s|^SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=true|" .env
          sed -i "s|^BROADCAST_CONNECTION=.*|BROADCAST_CONNECTION=reverb|" .env
          sed -i "s|^REVERB_APP_ID=.*|REVERB_APP_ID=${{ secrets.REVERB_APP_ID }}|" .env
          sed -i "s|^REVERB_APP_KEY=.*|REVERB_APP_KEY=${{ secrets.REVERB_APP_KEY }}|" .env
          sed -i "s|^REVERB_APP_SECRET=.*|REVERB_APP_SECRET=${{ secrets.REVERB_APP_SECRET }}|" .env
          # Server-side: how the app container privately reaches the reverb
          # container to publish events, over the Docker network.
          sed -i "s|^REVERB_HOST=.*|REVERB_HOST=reverb|" .env
          # Client-side: what the browser connects to publicly, through
          # Cloudflare Tunnel's TLS-terminated path rule (see
          # docker/cloudflared-setup.sh).
          sed -i "s|^VITE_REVERB_PORT=.*|VITE_REVERB_PORT=443|" .env
          sed -i "s|^VITE_REVERB_SCHEME=.*|VITE_REVERB_SCHEME=https|" .env
          echo "STRIPE_KEY=${{ secrets.STRIPE_KEY }}" >> .env
          echo "STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}" >> .env
          echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> .env
          sed -i "s|^MAIL_MAILER=.*|MAIL_MAILER=resend|" .env
          sed -i "s|^MAIL_FROM_ADDRESS=.*|MAIL_FROM_ADDRESS=hello@xn--rull-eva.lv|" .env
          echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> .env
          # Drop .env.example's blank placeholder first, so Compose never sees
          # the key twice.
          sed -i "/^CAMERA_RTSP_URL=/d" .env
          echo "CAMERA_RTSP_URL=${{ secrets.CAMERA_RTSP_URL }}" >> .env

      # Builds, snapshots the database, starts the stack, waits for the health
      # checks and rolls back to the previous image if they fail. See
      # docker/deploy.sh.
      #
      # Pre-launch switch: set the repository variable FRESH_DB_ON_DEPLOY to
      # `true` (Settings > Secrets and variables > Actions > Variables) and
      # every deploy wipes and reseeds the database. Delete it or set it to
      # anything else to go back to normal migrations. It needs the
      # SEED_PASSWORD secret (the seeded staff accounts' password).
      - name: Deploy
        if: steps.fresh.outputs.current == 'true'
        env:
          FRESH_DB_ON_DEPLOY: ${{ vars.FRESH_DB_ON_DEPLOY }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: ./docker/deploy.sh
